<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Jefe - AB SOLERTIA</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:white;padding:16px}
.card{background:white;color:#0f172a;border-radius:16px;padding:14px;margin:10px 0} .kpi{display:flex;gap:8px}
.kpi div{background:#1e293b;padding:14px;border-radius:12px;flex:1;text-align:center}
input{width:100%;padding:14px;border-radius:12px;border:none;margin:12px 0}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWWN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let all=[];
const q = query(collection(db,"visitas"), orderBy("creado","desc"));
onSnapshot(q, (snap)=>{
 all=[]; let tot=0,ped=0,cob=0;
 snap.forEach(doc=>{const d=doc.data(); all.push(d); tot++; ped+=parseFloat(d.pedido||0); cob+=parseFloat(d.cobro||0);});
 document.getElementById('total').innerText=tot; document.getElementById('pedidos').innerText='$'+ped.toLocaleString(); document.getElementById('cobros').innerText='$'+cob.toLocaleString();
 render();
});
window.render=()=>{
 const f=document.getElementById('filtro').value.toLowerCase();
 const cont=document.getElementById('lista'); cont.innerHTML='';
 all.filter(v=>!f || v.cliente.toLowerCase().includes(f) || v.empresa.toLowerCase().includes(f) || v.vendedor.toLowerCase().includes(f)).forEach(v=>{
   const el=document.createElement('div'); el.className='card';
   el.innerHTML=`<b>${v.cliente}</b> <small style="float:right">${v.hora||''}</small><br><small>${v.empresa} | ${v.vendedor} | Ped: $${v.pedido||0} | Cob: $${v.cobro||0}</small><br><img src="${v.foto}" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-top:8px"><br><a target="_blank" href="https://maps.google.com/?q=${v.lat},${v.lng}" style="color:#2563eb">📍 ${v.lat?.toFixed(4)},${v.lng?.toFixed(4)} - Ver mapa</a>`;
   cont.appendChild(el);
 });
}
</script></head><body>
<h2>🔒 Panel Admin AB SOLERTIA</h2><p style="color:#94a3b8">En vivo desde Cúcuta - Firebase conectado</p>
<div class="kpi" style="margin-top:16px"><div><b id="total">0</b><br><small>Visitas</small></div><div><b id="pedidos">$0</b><br><small>Pedidos</small></div><div><b id="cobros">$0</b><br><small>Cobros</small></div></div>
<input id="filtro" placeholder="Filtrar: CLIENTE6, Pepe, vendedor1..." oninput="render()">
<div id="lista"><p style="text-align:center;color:#94a3b8;margin-top:30px">Esperando visitas de vendedores...</p></div>
</body></html>
