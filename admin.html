<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrazaGO | Panel Jefe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;padding:12px}
.top{background:#0f172a;color:white;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn{padding:8px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-green{background:#16a34a;color:white}
.btn-white{background:white;color:#0f172a}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:white;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px #0001}
.stat b{font-size:22px;display:block}
.rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.vend-card{background:white;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0001;border-left:5px solid #0f172a}
.visita{background:white;padding:12px;border-radius:14px;margin:8px 0;display:flex;gap:10px;box-shadow:0 1px 4px #0001}
.visita img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.visita .firma-mini{width:70px;height:40px;object-fit:contain;border-radius:6px;border:1px solid #e2e8f0;background:#fff}
.login{max-width:360px;margin:60px auto;background:white;padding:24px;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}
.login button{width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:white;font-weight:bold;margin-top:6px;cursor:pointer}
.card{background:white;padding:14px;border-radius:16px;margin:14px 0;box-shadow:0 2px 8px #0001}
.card input{width:100%;padding:12px;border-radius:10px;border:1px solid #e2e8f0;margin:6px 0}
.card button{background:#0f172a;color:white;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-top:4px;cursor:pointer}
.vendedor-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.search-box{width:100%;padding:12px;border-radius:10px;border:2px solid #0f172a;margin:10px 0;font-size:16px}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, orderBy, limit, startAfter, doc, getDoc, setDoc, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const secondaryApp = initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = getAuth(secondaryApp);
await setPersistence(secondaryAuth, inMemoryPersistence);

let datosGlobal=[];
let miEmpresaId = null;

window.entrarAdmin = async () => {
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value.trim();
  const err = document.getElementById('adminErr');
  err.innerText = 'Verificando...';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const userSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
    if(!userSnap.exists()){
      err.innerText = 'Usuario no encontrado en la base de datos';
      await signOut(auth); return;
    }
    const rol = userSnap.data().rol;
    if(rol !== "admin" && rol !== "superadmin"){
      err.innerText = 'Acceso denegado: No tienes permisos de administrador';
      await signOut(auth); return;
    }
    miEmpresaId = userSnap.data().empresa_id;
    document.getElementById('nombreEmpresaTop').innerText = userSnap.data().empresa_nombre || '';
    document.getElementById('loginAdmin').style.display='none';
    document.getElementById('panel').style.display='block';
    await cargar(); await cargarVendedores(); await cargarHistorial(true); cambiarTab('hoy');
  } catch(e) { err.innerText='Error: Correo o contraseña incorrectos'; }
}

window.invitarVendedor = async () => {
  const email = document.getElementById('vendEmail').value.trim();
  const pass = document.getElementById('vendPass').value.trim();
  if(!email || !pass){ alert('Completa los datos'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    await setDoc(doc(db, "usuarios", cred.user.uid), { email, empresa_id: miEmpresaId, rol: "vendedor" });
    await signOut(secondaryAuth);
    alert('✅ Mensajero creado'); cargarVendedores();
  } catch(e) { alert('Error: ' + e.code); }
}

async function cargarVendedores(){
  const snap = await getDocs(query(collection(db,"usuarios"), where("empresa_id","==",miEmpresaId), where("rol","==","vendedor")));
  let html = '';
  snap.forEach(d=>{ html += `<div class="vendedor-item"><span>👤 ${d.data().email}</span><button style="width:auto;padding:4px 10px;background:#dc2626;color:white;border:none;border-radius:8px;font-size:12px;cursor:pointer" onclick="eliminarVendedor('${d.id}','${d.//CORTADO POR ESPACIO' data().email}')">🗑️</button></div>`; });
  document.getElementById('listaVendedores').innerHTML = html || 'No hay mensajeros';
}

window.eliminarVendedor = async (uid, email) => {
  if(confirm(`¿Eliminar a ${email}?`)){ await deleteDoc(doc(db, "usuarios", uid)); cargarVendedores(); }
}

window.cambiarTab = (tab) => {
  document.getElementById('lista').style.display = tab === 'hoy' ? 'block' : 'none';
  document.getElementById('historial').style.display = tab === 'hoy' ? 'none' : 'block';
  document.getElementById('tabHoy').style.background = tab === 'hoy' ? '#0f172a' : 'white';
  document.getElementById('tabHoy').style.color = tab === 'hoy' ? 'white' : '#0f172a';
  document.getElementById('tabHistorial').style.background = tab === 'hoy' ? 'white' : '#0f172a';
  document.getElementById('tabHistorial').style.color = tab === 'hoy' ? '#0f172a' : 'white';
}

function tarjetaVisita(d, index){
  const estadoColor = d.estado === 'Entregado' ? '#16a34a' : (d.estado === 'Rechazado' ? '#dc2626' : '#ea580c');
  return `<div class="visita"><img src="${d.foto||''}"><div style="flex:1"><b style="font-size:16px">📦 ${d.guia||'S/G'}</b> - <span style="color:${estadoColor}; font-weight:bold">${d.estado||'S/E'}</span><br><small>👤 ${d.cliente||''}</small><br><span style="background:#0f172a;color:white;padding:2px 8px;border-radius:20px;font-size:11px">${d.vendedor||''}</span><br><small>${d.hora||''}</small><br><div style="margin-top:5px; display:flex; gap:10px"><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" style="font-size:12px">📍 Mapa</a><button onclick="descargarPDF(${index})" style="font-size:11px; padding:2px 5px; cursor:pointer">📄 PDF</button></div></div><img class="firma-mini" src="${d.firma||''}"></div>`;
}

async function cargar(){
 const inicioHoy = new Date(); inicioHoy.setHours(0,0,0,0);
 const snap = await getDocs(query(collection(db,"visitas"), where("empresa_id","==",miEmpresaId), where("creado",">=",Timestamp.fromDate(inicioHoy))));
 let totalVis=0, totalFirmadas=0; let porVendedor = {}; datosGlobal=[]; let htmlVisitas='';
 snap.forEach((doc, index)=>{
   const d=doc.data(); datosGlobal.push(d); totalVis++; if(d.firma) totalFirmadas++;
   const vend=(d.vendedor||'sin-vendedor').toLowerCase();
   if(!porVendedor[vend]) porVendedor[vend]={visitas:0,firmadas:0};
   porVendedor[vend].visitas++; if(d.firma) porVendedor[vend].firmadas++;
   htmlVisitas+=tarjetaVisita(d, index);
 });
 document.getElementById('totalVis').innerText=totalVis;
 document.getElementById('totalFirmadas').innerText=totalFirmadas;
 document.getElementById('totalSinFirma').innerText=totalVis-totalFirmadas;
 let htmlRank='';
 Object.keys(porVendedor).sort().forEach(v=>{
   const r=porVendedor[v];
   htmlRank+=`<div class="vend-card"><b>👤 ${v}</b><br><small>${r.visitas} entregas</small></div>`;
 });
 document.getElementById('ranking').innerHTML=htmlRank || 'No hay datos';
 document.getElementById('lista').innerHTML=htmlVisitas || 'No hay entregas hoy';
}
window.cargar=cargar;

window.filtrarEntregas = () => {
  const texto = document.getElementById('searchGuia').value.toLowerCase();
  const filtrados = datosGlobal.filter(d => d.guia.toLowerCase().includes(texto) || d.cliente.toLowerCase().includes(texto));
  document.getElementById('lista').innerHTML = filtrados.map((d, i) => tarjetaVisita(d, i)).join('');
}

window.descargarPDF = async (index) => {
  const { jsPDF } = window.jspdf;
  const docPdf = new jsPDF();
  const d = datosGlobal[index];
  docPdf.setFontSize(20); docPdf.text("Certificado de Entrega - TrazaGO", 20, 20);
  docPdf.setFontSize(12); docPdf.text(`Guía/Pedido: ${d.guia}`, 20, 35);
  docPdf.text(`Receptor: ${d.cliente}`, 20, 42); docPdf.text(`Estado: ${d.estado}`, 20, 49);
  docPdf.text(`Mensajero: ${d.vendedor}`, 20, 56); docPdf.text(`Fecha y Hora: ${d.hora}`, 20, 63);
  docPdf.text(`Ubicación: ${d.lat}, ${d.lng}`, 20, 70);
  if(d.foto) docPdf.addImage(d.foto, 'JPEG', 20, 80, 60, 60);
  if(d.firma) docPdf.addImage(d.firma, 'PNG', 100, 80, 60, 30);
  docPdf.text("Este documento sirve como prueba legal de entrega.", 20, 160);
  docPdf.save(`Entrega_${d.guia}.pdf`);
}

window.descargarExcel=()=>{
  if(datosGlobal.length==0){alert('No hay datos');return;}
  const datosExcel = datosGlobal.map(d=>({ Mensajero: d.vendedor, Guia: d.guia, Estado: d.estado, Receptor: d.cliente, Firmado: d.firma?'Sí':'No', Fecha: d.hora, Mapa: `https://www.google.com/maps?q=${d.lat},${d.lng}` }));
  const ws = XLSX.utils.json_to_sheet(datosExcel); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Entregas");
  XLSX.writeFile(wb, `TrazaGO_Entregas.xlsx`);
}

async function cargarHistorial(reset){
  if(reset) document.getElementById('historial').innerHTML='';
  const snap = await getDocs(query(collection(db,"visitas"), where("empresa_id","==",miEmpresaId), orderBy("creado","desc"), limit(50)));
  let html = ''; snap.forEach((doc, i) => { html += tarjetaVisita(doc.data(), i); });
  document.getElementById('historial').innerHTML = html || 'No hay historial';
}
</script></head><body>
<div id="loginAdmin" class="login"><h2 style="text-align:center">TrazaGO</h2><p style="text-align:center; color:gray">Acceso Jefe de Empresa</p><br><input id="adminEmail" placeholder="Correo"><input id="adminPass" type="password" placeholder="Contraseña"><button onclick="entrarAdmin()">Entrar al Panel</button><p id="adminErr" style="color:red; text-align:center"></p></div>
<div id="panel" style="display:none"><div class="top"><h3>TrazaGO - Control <small id="nombreEmpresaTop" style="font-weight:normal"></small></h3><div style="display:flex;gap:8px"><button class="btn btn-green" onclick="descargarExcel()">📊 Excel</button><button class="btn btn-white" onclick="cargar()">↻ Actualizar</button></div></div><div class="stats"><div class="stat"><b id="totalVis">0</b><small>Totales</small></div><div class="stat"><b id="totalFirmadas" style="color:#16a34a">0</b><small>Con Firma</small></div><div class="stat"><b id="totalSinFirma" style="color:#dc2626">0</b><small>Sin Firma</small></div></div><div class="card"><h4>🔍 Buscar Entrega</h4><input id="searchGuia" class="search-box" placeholder="Escribe la guía o cliente..." oninput="filtrarEntregas()"></div><div class="card"><h4>➕ Invitar Mensajero</h4><input id="vendEmail" placeholder="Correo"><input id="vendPass" type="password" placeholder="Clave"><button onclick="invitarVendedor()">Crear acceso</button><div id="listaVendedores" style="margin-top:10px"></div></div><h4 style="margin:10px 4px">🏆 Productividad</h4><div id="ranking" class="rank"></div><div style="display:flex;gap:8px;margin:18px 4px 8px"><button id="tabHoy" class="btn btn-white" style="flex:1" onclick="cambiarTab('hoy')">📋 Hoy</button><button id="tabHistorial" class="btn btn-white" style="flex:1" onclick="cambiarTab('historial')"></button></div><div id="lista"></div><div id="historial" style="display:none"></div></div></body></html>
