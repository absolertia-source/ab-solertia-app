<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, getDocsFromServer, query, where, orderBy, limit, doc, getDoc, setDoc, updateDoc, deleteDoc, Timestamp, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const secondaryApp  = initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = getAuth(secondaryApp);
await setPersistence(secondaryAuth, inMemoryPersistence);

let datosGlobal = [];
let entregasPorId = {};
let miEmpresaId = null;
let miEmail = null;
let autoRefreshTimer = null;
let jornadaActual = null;
let jornadasLista = [];
let modoVista = 'jornada';
let jornadaSeleccionada = null;
let fechaSeleccionada = new Date();

// ==================== HELPERS ====================
function fechaParaInput(d){
  const y  = d.getFullYear();
  const m  = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function formatearFecha(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
}
function formatearFechaHora(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('es-CO', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
function duracionDesde(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Date.now() - d.getTime();
  const mins = Math.floor(diff / 60000);
  if(mins < 60) return mins + ' min';
  const hrs = Math.floor(mins/60);
  const minRestantes = mins % 60;
  return hrs + 'h ' + minRestantes + 'min';
}
function timestampAMillis(ts){
  if(!ts) return 0;
  if(ts.toMillis) return ts.toMillis();
  if(ts.toDate) return ts.toDate().getTime();
  return new Date(ts).getTime();
}

// ==================== LOGIN ====================
window.entrarAdmin = async () => {
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value.trim();
  const err = document.getElementById('adminErr');
  err.innerText = 'Verificando...';

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const userSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
    if(!userSnap.exists()){
      err.innerText = '❌ ERROR: Usuario autenticado pero NO EXISTE en la tabla "usuarios"';
      await signOut(auth); return;
    }
    const userData = userSnap.data();
    const rol = userData.rol;
    if(rol !== "admin" && rol !== "superadmin"){
      err.innerText = `❌ ERROR: Tu rol es "${rol}". Se requiere "admin" o "superadmin"`;
      await signOut(auth); return;
    }
    miEmpresaId = userData.empresa_id;
    miEmail = email;
    if(!miEmpresaId){
      err.innerText = '❌ ERROR: Usuario sin empresa_id asignada';
      await signOut(auth); return;
    }

    document.getElementById('nombreEmpresaTop').innerText = userData.empresa_nombre || '';
    document.getElementById('loginAdmin').style.display='none';
    document.getElementById('panel').style.display='block';

    fechaSeleccionada = new Date();
    document.getElementById('fechaSelector').value = fechaParaInput(fechaSeleccionada);

    await cargarJornadas();
    await cargarJornadaActual();
    await cargarVendedores();
    await cargarHistorial(true);
    iniciarAutoRefresh();
    actualizarUIVista();
    await cargarLista();
  } catch(e) {
    if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
        err.innerText = '❌ ERROR: Correo o contraseña incorrectos';
    } else {
        err.innerText = '❌ ERROR TÉCNICO: ' + e.message;
    }
  }
}

// ==================== JORNADAS ====================
async function cargarJornadas(){
  jornadasLista = [];
  try {
    let snap;
    try {
      snap = await getDocsFromServer(query(
        collection(db, "jornadas"),
        where("empresa_id","==",miEmpresaId),
        limit(50)
      ));
    } catch(e1){
      snap = await getDocs(query(
        collection(db, "jornadas"),
        where("empresa_id","==",miEmpresaId),
        limit(50)
      ));
    }
    snap.forEach(d => {
      jornadasLista.push({ id: d.id, ...d.data() });
    });
    jornadasLista.sort((a,b) => timestampAMillis(b.inicio) - timestampAMillis(a.inicio));
  } catch(e){
    console.error('❌ Error cargando jornadas:', e);
  }
  renderizarSelectJornadas();
}

async function cargarJornadaActual(){
  jornadaActual = null;
  try {
    let snap;
    try {
      snap = await getDocsFromServer(query(
        collection(db, "jornadas"),
        where("empresa_id","==",miEmpresaId),
        limit(50)
      ));
    } catch(e1){
      snap = await getDocs(query(
        collection(db, "jornadas"),
        where("empresa_id","==",miEmpresaId),
        limit(50)
      ));
    }
    snap.forEach(d => {
      const data = d.data();
      if(data.estado === 'abierta'){
        jornadaActual = { id: d.id, ...data };
      }
    });
  } catch(e){
    console.error('❌ Error cargando jornada actual:', e);
    jornadaActual = null;
  }
  renderizarJornadaActual();

  if(modoVista === 'jornada' && !jornadaSeleccionada && jornadaActual){
    jornadaSeleccionada = jornadaActual.id;
    const sel = document.getElementById('jornadaSelector');
    if(sel) sel.value = jornadaSeleccionada;
  }
}

function renderizarJornadaActual(){
  const cont = document.getElementById('jornadaActualCard');
  if(!cont) return;

  if(jornadaActual){
    cont.className = 'jornada-actual';
    cont.innerHTML = `
      <div class="jornada-info">
        <b>🟢 ${jornadaActual.nombre || 'Jornada sin nombre'}</b><span class="badge-abierta">ABIERTA</span>
        <small>Iniciada hace ${duracionDesde(jornadaActual.inicio)} · ${formatearFechaHora(jornadaActual.inicio)}</small>
        <small>Creada por: ${jornadaActual.creada_por || '—'}</small>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-white" onclick="verJornadaActual()">👁 Ver entregas</button>
        <button class="btn btn-red" onclick="cerrarJornada('${jornadaActual.id}')">🔒 Cerrar jornada</button>
      </div>`;
  } else {
    cont.className = 'jornada-actual inactiva';
    cont.innerHTML = `
      <div class="jornada-info">
        <b>🟡 No hay jornada abierta</b>
        <small>Los mensajeros pueden registrar entregas, pero quedarán como "sin jornada"</small>
      </div>
      <button class="btn btn-green" onclick="abrirModalNuevaJornada()">➕ Abrir nueva jornada</button>`;
  }
}

function renderizarSelectJornadas(){
  const sel = document.getElementById('jornadaSelector');
  if(!sel) return;
  let html = '<option value="">— Selecciona una jornada —</option>';
  jornadasLista.forEach(j => {
    const estado = j.estado === 'abierta' ? '🟢' : '🔴';
    const fecha = formatearFecha(j.inicio);
    html += `<option value="${j.id}">${estado} ${j.nombre || 'Sin nombre'} · ${fecha}</option>`;
  });
  sel.innerHTML = html;
}

window.abrirModalNuevaJornada = () => {
  if(jornadaActual){
    alert('⚠️ Ya hay una jornada abierta.\n\nCiérrala primero antes de abrir otra.');
    return;
  }
  const nombreDefecto = 'Jornada del ' + new Date().toLocaleDateString('es-CO', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  document.getElementById('nuevaJornadaNombre').value = nombreDefecto;
  document.getElementById('nuevaJornadaNotas').value = '';
  document.getElementById('modalNuevaJornada').style.display = 'flex';
}

window.cerrarModalNuevaJornada = () => {
  document.getElementById('modalNuevaJornada').style.display = 'none';
}

window.confirmarNuevaJornada = async () => {
  const nombre = document.getElementById('nuevaJornadaNombre').value.trim();
  const notas = document.getElementById('nuevaJornadaNotas').value.trim();
  if(!nombre){ alert('Ponle un nombre a la jornada'); return; }

  const idNueva = 'j_' + Date.now();
  try {
    await setDoc(doc(db, "jornadas", idNueva), {
      empresa_id: miEmpresaId,
      nombre: nombre,
      notas: notas,
      inicio: serverTimestamp(),
      fin: null,
      estado: 'abierta',
      creada_por: miEmail,
      cerrada_por: null,
      total_entregas: 0
    });
    cerrarModalNuevaJornada();
    await cargarJornadas();
    await cargarJornadaActual();
    alert('✅ Jornada abierta: ' + nombre);
    await cargarLista();
  } catch(e){
    console.error(e);
    alert('Error al crear jornada: ' + e.message);
  }
}

// ✅ CORREGIDO: sin where(jornada_id), filtra empresa y cuenta en JS
window.cerrarJornada = async (id) => {
  if(!confirm('⚠️ ¿Cerrar la jornada actual?\n\nLos mensajeros ya no asociarán nuevas entregas a esta jornada.')) return;

  try {
    // SOLO where(empresa_id) → evita error de permisos
    let rawSnap;
    try {
      rawSnap = await getDocsFromServer(query(
        collection(db,"visitas"),
        where("empresa_id","==",miEmpresaId),
        limit(1000)
      ));
    } catch(e){
      rawSnap = await getDocs(query(
        collection(db,"visitas"),
        where("empresa_id","==",miEmpresaId),
        limit(1000)
      ));
    }

    // Contar en JS las que son de esta jornada
    let total = 0;
    rawSnap.forEach(d => {
      if(d.data().jornada_id === id) total++;
    });

    await updateDoc(doc(db, "jornadas", id), {
      estado: 'cerrada',
      fin: serverTimestamp(),
      cerrada_por: miEmail,
      total_entregas: total
    });

    await cargarJornadas();
    await cargarJornadaActual();
    alert('🔒 Jornada cerrada.\n\nEntregas en esta jornada: ' + total);
    await cargarLista();
  } catch(e){
    console.error(e);
    alert('Error al cerrar: ' + e.message);
  }
}

window.reabrirJornada = async (id) => {
  if(jornadaActual){
    alert('⚠️ Ya hay otra jornada abierta. Ciérrala primero.');
    return;
  }
  if(!confirm('⚠️ ¿Reabrir esta jornada?\n\nVolverá a estar activa.')) return;
  if(!confirm('🛑 CONFIRMACIÓN FINAL\n\n¿Estás completamente seguro?')) return;

  try {
    await updateDoc(doc(db, "jornadas", id), {
      estado: 'abierta',
      fin: null,
      cerrada_por: null
    });
    await cargarJornadas();
    await cargarJornadaActual();
    alert('🔓 Jornada reabierta.');
    await cargarLista();
  } catch(e){
    alert('Error: ' + e.message);
  }
}

window.verJornadaActual = () => {
  modoVista = 'jornada';
  jornadaSeleccionada = jornadaActual?.id || '';
  document.getElementById('modoVista').value = 'jornada';
  document.getElementById('jornadaSelector').value = jornadaSeleccionada;
  actualizarUIVista();
  cargarLista();
}

window.cambiarModoVista = () => {
  modoVista = document.getElementById('modoVista').value;
  document.getElementById('searchGuia').value = '';
  document.getElementById('buscarGlobal').checked = false;
  actualizarUIVista();
  cargarLista();
}

window.cambiarJornadaSeleccionada = (val) => {
  jornadaSeleccionada = val;
  cargarLista();
}

window.cambiarFecha = (val) => {
  if(val){
    const [y, m, d] = val.split('-').map(Number);
    fechaSeleccionada = new Date(y, m-1, d);
  } else {
    fechaSeleccionada = new Date();
  }
  cargarLista();
}

window.irAHoy = () => {
  fechaSeleccionada = new Date();
  document.getElementById('fechaSelector').value = fechaParaInput(fechaSeleccionada);
  cargarLista();
}

function actualizarUIVista(){
  document.getElementById('grupoJornada').style.display = modoVista === 'jornada' ? 'block' : 'none';
  document.getElementById('grupoFecha').style.display = modoVista === 'fecha' ? 'block' : 'none';
  document.getElementById('grupoSinJornada').style.display = modoVista === 'sinjornada' ? 'block' : 'none';
}

// ==================== AUTO REFRESH ====================
function iniciarAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => {
    if(document.visibilityState === 'visible' && miEmpresaId){
      const searchVal = (document.getElementById('searchGuia')?.value || '').trim();
      if(!searchVal){
        cargarJornadaActual().catch(()=>{});
        cargarLista().catch(e => console.warn('Auto-refresh falló', e));
      }
    }
  }, 30000);
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && miEmpresaId){
    cargarJornadaActual().catch(()=>{});
    if(!(document.getElementById('searchGuia')?.value || '').trim()){
      cargarLista().catch(()=>{});
    }
  }
});

// ==================== RECARGA MANUAL ====================
window.recargarTodo = async () => {
  const btn = document.getElementById('btnActualizar');
  if(btn) btn.classList.add('pulse');
  try {
    document.getElementById('searchGuia').value = '';
    document.getElementById('buscarGlobal').checked = false;
    await cargarJornadas();
    await cargarJornadaActual();
    await cargarVendedores();
    await cargarHistorial(true);
    await cargarLista();
    actualizarUltimaSync();
  } catch(e){
    alert('Error: ' + e.message);
  } finally {
    setTimeout(() => btn && btn.classList.remove('pulse'), 600);
  }
}

function actualizarUltimaSync(){
  const el = document.getElementById('lastUpdate');
  if(el) el.innerText = 'Última actualización: ' + new Date().toLocaleTimeString();
}

// ==================== INVITAR VENDEDOR ====================
window.invitarVendedor = async () => {
  const email = document.getElementById('vendEmail').value.trim();
  const pass = document.getElementById('vendPass').value.trim();
  if(!email || !pass){ alert('Datos incompletos'); return; }
  if(pass.length < 6){ alert('La contraseña debe tener al menos 6 caracteres'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    await setDoc(doc(db, "usuarios", cred.user.uid), {
      email,
      empresa_id: miEmpresaId,
      empresa_nombre: document.getElementById('nombreEmpresaTop').innerText || '',
      rol: "vendedor",
      creado: Timestamp.now()
    });
    await signOut(secondaryAuth);
    alert('✅ Mensajero creado');
    document.getElementById('vendEmail').value = '';
    document.getElementById('vendPass').value = '';
    cargarVendedores();
  } catch(e) {
    if(e.code === 'auth/email-already-in-use'){
      alert('⚠️ Ese correo ya está registrado en Authentication.');
    } else {
      alert('Error: ' + e.code);
    }
  }
}

async function cargarVendedores(){
  let snap;
  try {
    snap = await getDocsFromServer(query(
      collection(db,"usuarios"),
      where("empresa_id","==",miEmpresaId),
      where("rol","==","vendedor")
    ));
  } catch(e){
    snap = await getDocs(query(
      collection(db,"usuarios"),
      where("empresa_id","==",miEmpresaId),
      where("rol","==","vendedor")
    ));
  }
  let html = '';
  snap.forEach(d => {
    const email = d.data().email || '(sin correo)';
    html += `<div class="vendedor-item"><span>👤 ${email}</span><button style="width:auto;padding:4px 10px;background:#dc2626;color:white;border:none;border-radius:8px;font-size:12px;cursor:pointer" onclick="eliminarVendedor('${d.id}','${email}')">🗑️</button></div>`;
  });
  document.getElementById('listaVendedores').innerHTML = html || 'No hay mensajeros';
}

window.eliminarVendedor = async (uid, email) => {
  if(confirm(`¿Eliminar a ${email}?`)){
    await deleteDoc(doc(db, "usuarios", uid));
    cargarVendedores();
  }
}

// ==================== TABS ====================

  document.getElementById('tabHoy').style.color = tab === 'hoy' ? 'white' : '#0f172a';
  document.getElementById('tabHistorial').style.background = tab === 'hoy' ? 'white' : '#0f172a';
  document.getElementById('tabHistorial').style.color = tab === 'hoy' ? '#0f172a' : 'white';
}

// ==================== TARJETA ====================
function tarjetaVisita(d, docId){
  const estadoColor = d.estado === 'Entregado' ? '#16a34a' : (d.estado === 'Rechazado' ? '#dc2626' : '#ea580c');
  const foto  = d.foto  || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70"><rect width="70" height="70" fill="%23e2e8f0"/></svg>';
  const firma = d.firma || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="70" height="40"><rect width="70" height="40" fill="%23f1f5f9"/></svg>';
  const guiaSegura = (d.guia || '').replace(/'/g, '').replace(/"/g, '');
  const jornadaBadge = d.jornada_id
    ? `<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:20px;font-size:10px;margin-left:4px">📋 ${d.jornada_nombre || 'jornada'}</span>`
    : `<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:20px;font-size:10px;margin-left:4px">⚠️ Sin jornada</span>`;
  return `<div class="visita"><img src="${foto}"><div style="flex:1"><b style="font-size:16px">📦 ${d.guia||'S/G'}</b> - <span style="color:${estadoColor}; font-weight:bold">${d.estado||'S/E'}</span>${jornadaBadge}<br><small>👤 ${d.cliente||''}</small><br><span style="background:#0f172a;color:white;padding:2px 8px;border-radius:20px;font-size:11px">${d.vendedor||''}</span><br><small>${d.hora||''}</small><br><div style="margin-top:5px; display:flex; gap:10px; flex-wrap:wrap"><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" style="font-size:12px">📍 Mapa</a><button onclick="descargarPDF('${docId}')" style="font-size:11px; padding:4px 8px; cursor:pointer; background:#0f172a; color:white; border:none; border-radius:6px">📄 PDF</button><button onclick="eliminarEntrega('${docId}', '${guiaSegura}')" style="font-size:11px; padding:4px 8px; cursor:pointer; background:#dc2626; color:white; border:none; border-radius:6px">🗑️ Borrar</button></div></div><img class="firma-mini" src="${firma}"></div>`;
}

// ==================== CARGAR LISTA ====================
async function cargarLista(){
  let snap;
  try {
    if(modoVista === 'jornada' && jornadaSeleccionada){
      // ✅ CORREGIDO: solo where(empresa_id), filtramos jornada en JS
      let rawSnap;
      try {
        rawSnap = await getDocsFromServer(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          limit(1000)
        ));
      } catch(e1){
        rawSnap = await getDocs(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          limit(1000)
        ));
      }
      const arr = [];
      rawSnap.forEach(d => {
        const data = d.data();
        if(data.jornada_id === jornadaSeleccionada) arr.push({id: d.id, data});
      });
      arr.sort((a,b) => timestampAMillis(b.data.creado) - timestampAMillis(a.data.creado));
      snap = { forEach: cb => arr.forEach(x => cb({ id: x.id, data: () => x.data })) , size: arr.length };

    } else if(modoVista === 'fecha'){
      const inicio = new Date(fechaSeleccionada); inicio.setHours(0,0,0,0);
      const fin = new Date(fechaSeleccionada);    fin.setHours(23,59,59,999);
      try {
        snap = await getDocsFromServer(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          where("creado",">=",Timestamp.fromDate(inicio)),
          where("creado","<=",Timestamp.fromDate(fin))
        ));
      } catch(e){
        snap = await getDocs(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          where("creado",">=",Timestamp.fromDate(inicio)),
          where("creado","<=",Timestamp.fromDate(fin))
        ));
      }
    } else if(modoVista === 'sinjornada'){
      let rawSnap;
      try {
        rawSnap = await getDocsFromServer(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          limit(1000)
        ));
      } catch(e){
        rawSnap = await getDocs(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          limit(1000)
        ));
      }
      const arr = [];
      rawSnap.forEach(d => {
        const data = d.data();
        if(!data.jornada_id) arr.push({id: d.id, data});
      });
      arr.sort((a,b) => timestampAMillis(b.data.creado) - timestampAMillis(a.data.creado));
      snap = { forEach: cb => arr.forEach(x => cb({ id: x.id, data: () => x.data })) , size: arr.length };

    } else {
      document.getElementById('lista').innerHTML = '<p style="text-align:center;color:#64748b;padding:20px">Selecciona una jornada o una fecha</p>';
      document.getElementById('ranking').innerHTML = 'No hay datos';
      document.getElementById('totalVis').innerText = 0;
      document.getElementById('totalFirmadas').innerText = 0;
      document.getElementById('totalSinFirma').innerText = 0;
      return;
    }
  } catch(e){
    console.error(e);
    document.getElementById('lista').innerHTML = '<p style="color:#dc2626;padding:20px">Error al cargar: ' + e.message + '</p>';
    return;
  }

  let totalVis = 0, totalFirmadas = 0;
  let porVendedor = {};
  datosGlobal = [];
  entregasPorId = {};
  let htmlVisitas = '';

  snap.forEach((docSnap) => {
    const d = docSnap.data();
    datosGlobal.push(d);
    entregasPorId[docSnap.id] = d;
    totalVis++;
    if(d.firma) totalFirmadas++;
    const vend = (d.vendedor || 'sin-vendedor').toLowerCase();
    if(!porVendedor[vend]) porVendedor[vend] = {visitas:0, firmadas:0};
    porVendedor[vend].visitas++;
    if(d.firma) porVendedor[vend].firmadas++;
    htmlVisitas += tarjetaVisita(d, docSnap.id);
  });

  document.getElementById('totalVis').innerText = totalVis;
  document.getElementById('totalFirmadas').innerText = totalFirmadas;
  document.getElementById('totalSinFirma').innerText = totalVis - totalFirmadas;

  let htmlRank = '';
  Object.keys(porVendedor).sort().forEach(v => {
    const r = porVendedor[v];
    htmlRank += `<div class="vend-card"><b>👤 ${v}</b><br><small>${r.visitas} entregas</small></div>`;
  });
  document.getElementById('ranking').innerHTML = htmlRank || 'No hay datos';

  let vacio = 'No hay entregas en esta vista';
  if(modoVista === 'jornada') vacio = 'Esta jornada no tiene entregas registradas';
  if(modoVista === 'fecha') vacio = 'No hay entregas en esa fecha';
  if(modoVista === 'sinjornada') vacio = 'No hay entregas sin jornada';

  document.getElementById('lista').innerHTML = htmlVisitas || vacio;
  actualizarUltimaSync();
}

// ==================== BÚSQUEDA ====================
window.filtrarEntregas = async () => {
  const texto = (document.getElementById('searchGuia').value || '').toLowerCase().trim();
  const buscarGlobal = document.getElementById('buscarGlobal')?.checked;

  if(!texto){
    await cargarLista();
    return;
  }

  if(buscarGlobal){
    document.getElementById('lista').innerHTML =
      '<p style="text-align:center;color:#64748b;padding:20px">🔎 Buscando en todo el historial...</p>';

    try {
      let rawSnap;
      try {
        rawSnap = await getDocsFromServer(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          limit(500)
        ));
      } catch(e){
        rawSnap = await getDocs(query(
          collection(db,"visitas"),
          where("empresa_id","==",miEmpresaId),
          limit(500)
        ));
      }

      const todos = [];
      rawSnap.forEach(docSnap => {
        const d = docSnap.data();
        entregasPorId[docSnap.id] = d;
        todos.push({ id: docSnap.id, data: d });
      });
      todos.sort((a,b) => timestampAMillis(b.data.creado) - timestampAMillis(a.data.creado));

      const filtrados = todos.filter(({data: d}) => {
        const guia    = (d.guia     || '').toLowerCase();
        const cliente = (d.cliente  || '').toLowerCase();
        const vend    = (d.vendedor || '').toLowerCase();
        const estado  = (d.estado   || '').toLowerCase();
        const jornada = (d.jornada_nombre || '').toLowerCase();
        return guia.includes(texto) || cliente.includes(texto) || vend.includes(texto) || estado.includes(texto) || jornada.includes(texto);
      });

      if(filtrados.length === 0){
        document.getElementById('lista').innerHTML =
          `<p style="text-align:center;color:#64748b;padding:20px">🔍 Sin resultados para "${texto}" en ninguna fecha</p>`;
        return;
      }

      const encabezado = `<p style="background:#eff6ff;color:#1e40af;padding:10px;border-radius:10px;font-size:13px;margin:0 4px 10px">
        📚 <b>${filtrados.length}</b> resultado(s) encontrado(s) en el historial
      </p>`;

      document.getElementById('lista').innerHTML = encabezado +
        filtrados.map(({id, data}) => tarjetaVisita(data, id)).join('');
    } catch(e) {
      document.getElementById('lista').innerHTML =
        `<p style="text-align:center;color:#dc2626;padding:20px">❌ Error: ${e.message}</p>`;
    }
    return;
  }

  const filtrados = datosGlobal.filter(d => {
    const guia    = (d.guia     || '').toLowerCase();
    const cliente = (d.cliente  || '').toLowerCase();
    const vend    = (d.vendedor || '').toLowerCase();
    const estado  = (d.estado   || '').toLowerCase();
    const jornada = (d.jornada_nombre || '').toLowerCase();
    return guia.includes(texto) || cliente.includes(texto) || vend.includes(texto) || estado.includes(texto) || jornada.includes(texto);
  });

  if(filtrados.length === 0){
    document.getElementById('lista').innerHTML =
      `<p style="text-align:center;color:#64748b;padding:20px">🔍 Sin resultados para "${texto}".<br><small style="color:#94a3b8">Prueba activar ☑️ "Buscar en todo el historial"</small></p>`;
    return;
  }

  document.getElementById('lista').innerHTML = filtrados.map(d => {
    const idReal = Object.keys(entregasPorId).find(k => entregasPorId[k] === d);
    return tarjetaVisita(d, idReal);
  }).join('');
}

// ==================== ELIMINAR ====================
window.eliminarEntrega = async (docId, guia) => {
  if(!confirm(`⚠️ ¿Borrar la entrega "${guia || docId}"?\n\nEsta acción NO se puede deshacer.`)) return;

  try {
    await deleteDoc(doc(db, "visitas", docId));
    await cargarLista();
    await cargarHistorial(true);
  } catch(e) {
    if(e.code === 'permission-denied'){
      alert('❌ No tienes permiso para borrar.');
    } else {
      alert('Error: ' + e.message);
    }
  }
}

// ==================== PDF ====================
window.descargarPDF = async (docId) => {
  const { jsPDF } = window.jspdf;
  const docPdf = new jsPDF();
  const d = entregasPorId[docId];
  if(!d){ alert('No se encontró la entrega'); return; }

  docPdf.setFontSize(20); docPdf.text("Certificado de Entrega - TrazaGO", 20, 20);
  docPdf.setFontSize(12);
  docPdf.text(`Guía/Pedido: ${d.guia || ''}`, 20, 35);
  docPdf.text(`Receptor: ${d.cliente || ''}`, 20, 42);
  docPdf.text(`Estado: ${d.estado || ''}`, 20, 49);
  docPdf.text(`Mensajero: ${d.vendedor || ''}`, 20, 56);
  docPdf.text(`Jornada: ${d.jornada_nombre || 'Sin jornada'}`, 20, 63);
  docPdf.text(`Fecha y Hora: ${d.hora || ''}`, 20, 70);
  docPdf.text(`Ubicación: ${d.lat || ''}, ${d.lng || ''}`, 20, 77);

  try {
    if(d.foto)  docPdf.addImage(d.foto,  'JPEG', 20, 87, 60, 60);
    if(d.firma) docPdf.addImage(d.firma, 'PNG', 100, 87, 60, 30);
  } catch(e){ console.warn(e); }

  docPdf.text("Este documento sirve como prueba legal de entrega.", 20, 165);
  docPdf.save(`Entrega_${d.guia || docId}.pdf`);
}

// ==================== EXCEL ====================
window.descargarExcel = () => {
  if(datosGlobal.length === 0){ alert('No hay datos para exportar'); return; }
  const datosExcel = datosGlobal.map(d => ({
    Jornada: d.jornada_nombre || 'Sin jornada',
    Mensajero: d.vendedor || '',
    Guia: d.guia || '',
    Estado: d.estado || '',
    Receptor: d.cliente || '',
    Firmado: d.firma ? 'Sí' : 'No',
    Fecha: d.hora || '',
    Mapa: `https://www.google.com/maps?q=${d.lat || ''},${d.lng || ''}`
  }));
  const ws = XLSX.utils.json_to_sheet(datosExcel);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Entregas");
  const etiqueta = modoVista === 'jornada' ? 'jornada' : fechaParaInput(fechaSeleccionada);
  XLSX.writeFile(wb, `TrazaGO_Entregas_${etiqueta}.xlsx`);
}

// ==================== HISTORIAL ====================
async function cargarHistorial(reset){
  if(reset) document.getElementById('historial').innerHTML = 'Cargando...';
  let snap;
  try {
    snap = await getDocsFromServer(query(
      collection(db,"visitas"),
      where("empresa_id","==",miEmpresaId),
      orderBy("creado","desc"),
      limit(50)
    ));
  } catch(e){
    snap = await getDocs(query(
      collection(db,"visitas"),
      where("empresa_id","==",miEmpresaId),
      orderBy("creado","desc"),
      limit(50)
    ));
  }
  let html = '';
  snap.forEach((docSnap) => {
    const d = docSnap.data();
    entregasPorId[docSnap.id] = d;
    html += tarjetaVisita(d, docSnap.id);
  });
  document.getElementById('historial').innerHTML = html || 'No hay historial';
}
