<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Jefe - TrazaGO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;padding:12px}
.top{background:#0f172a;color:white;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn{padding:8px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-green{background:#16a34a;color:white}
.btn-white{background:white;color:#0f172a}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:white;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px #0001}
.stat b{font-size:22px;display:block}
.rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.vend-card{background:white;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0001;border-left:5px solid #0f172a}
.visita{background:white;padding:12px;border-radius:14px;margin:8px 0;display:flex;gap:10px;box-shadow:0 1px 4px #0001}
.visita img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.login{max-width:360px;margin:60px auto;background:white;padding:24px;border-radius:20px}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}
.login button{width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:white;font-weight:bold;margin-top:6px}
.card{background:white;padding:14px;border-radius:16px;margin:14px 0}
.card input{width:100%;padding:12px;border-radius:10px;border:1px solid #e2e8f0;margin:6px 0}
.card button{background:#0f172a;color:white;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-top:4px}
.vendedor-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const secondaryApp = initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = getAuth(secondaryApp);
await setPersistence(secondaryAuth, inMemoryPersistence);

let datosGlobal=[];
let miEmpresaId = null;

window.entrarAdmin = async () => {
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value.trim();
  const err = document.getElementById('adminErr');
  err.innerText = '';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);

    const usuarioSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
    if(!usuarioSnap.exists() || usuarioSnap.data().rol !== "admin"){
      err.innerText = 'Esta cuenta no tiene permisos de administrador';
      await signOut(auth);
      return;
    }

    miEmpresaId = usuarioSnap.data().empresa_id;

    const empresaSnap = await getDoc(doc(db, "empresas", miEmpresaId));
    if(empresaSnap.exists() && empresaSnap.data().activa === false){
      err.innerText = 'Tu empresa fue suspendida. Contacta al proveedor.';
      await signOut(auth);
      return;
    }

    document.getElementById('nombreEmpresaTop').innerText = usuarioSnap.data().empresa_nombre || '';
    document.getElementById('loginAdmin').style.display='none';
    document.getElementById('panel').style.display='block';
    cargar();
    cargarVendedores();
  } catch(e) {
    err.innerText='Error: '+e.code;
  }
}

window.invitarVendedor = async () => {
  const email = document.getElementById('vendEmail').value.trim();
  const pass = document.getElementById('vendPass').value.trim();
  const msg = document.getElementById('vendMsg');
  msg.style.color = 'red';
  msg.innerText = '';

  if(!email || !pass){ msg.innerText='Completa correo y clave'; return; }
  if(pass.length < 6){ msg.innerText='La clave debe tener al menos 6 caracteres'; return; }

  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    await setDoc(doc(db, "usuarios", cred.user.uid), {
      email: email,
      empresa_id: miEmpresaId,
      rol: "vendedor"
    });
    await signOut(secondaryAuth);
    msg.style.color = 'green';
    msg.innerText = '✅ Vendedor creado: ' + email;
    document.getElementById('vendEmail').value = '';
    document.getElementById('vendPass').value = '';
    cargarVendedores();
  } catch(e) {
    msg.innerText = 'Error: ' + e.code;
  }
}

async function cargarVendedores(){
  const snap = await getDocs(query(collection(db,"usuarios"), where("empresa_id","==",miEmpresaId), where("rol","==","vendedor")));
  let html = '';
  snap.forEach(d=>{ html += `<div class="vendedor-item"><span>👤 ${d.data().email}</span></div>`; });
  document.getElementById('listaVendedores').innerHTML = html || '<small>Aún no has invitado vendedores</small>';
}

async function cargar(){
 const inicioHoy = new Date(); inicioHoy.setHours(0,0,0,0);
 const snap = await getDocs(query(collection(db,"visitas"), where("empresa_id","==",miEmpresaId)));
 let totalVis=0, totalPed=0, totalCob=0;
 let porVendedor = {}; datosGlobal=[];
 let htmlVisitas='';
snap.forEach(doc=>{
   const d=doc.data();
   if(!d.creado || d.creado.toDate() < inicioHoy) return;
   datosGlobal.push(d);
   totalVis++; totalPed+=Number(d.pedido||0); totalCob+=Number(d.cobro||0);
   const vend=(d.vendedor||'sin-vendedor').toLowerCase();
   if(!porVendedor[vend]) porVendedor[vend]={visitas:0,pedidos:0,cobros:0};
   porVendedor[vend].visitas++; porVendedor[vend].pedidos+=Number(d.pedido||0); porVendedor[vend].cobros+=Number(d.cobro||0);
   htmlVisitas+=`<div class="visita"><img src="${d.foto||''}"><div><b>${d.cliente||''}</b> - <span style="background:#0f172a;color:white;padding:2px 8px;border-radius:20px;font-size:11px">${d.vendedor||''}</span><br><small>Ped: $${Number(d.pedido||0).toLocaleString()} | Cob: $${Number(d.cobro||0).toLocaleString()} | ${d.hora||''}</small><br><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" style="font-size:12px">📍 Ver mapa</a></div></div>`;
 });
 document.getElementById('totalVis').innerText=totalVis;
 document.getElementById('totalPed').innerText='$'+totalPed.toLocaleString();
 document.getElementById('totalCob').innerText='$'+totalCob.toLocaleString();
 let htmlRank='';
 Object.keys(porVendedor).sort().forEach(v=>{
   const r=porVendedor[v];
   htmlRank+=`<div class="vend-card"><b>👤 ${v}</b><br><small>${r.visitas} visitas</small><br><div style="margin-top:6px"><b style="color:#16a34a">$${r.pedidos.toLocaleString()}</b> <small>Pedidos</small></div><div><b style="color:#2563eb">$${r.cobros.toLocaleString()}</b> <small>Cobros</small></div></div>`;
 });
 document.getElementById('ranking').innerHTML=htmlRank||'Aún no hay visitas';
 document.getElementById('lista').innerHTML=htmlVisitas;
}
window.cargar=cargar;

window.descargarExcel=()=>{
  if(datosGlobal.length==0){alert('No hay datos');return;}
  const datosExcel = datosGlobal.map(d=>({
    Vendedor: d.vendedor,
    Cliente: d.cliente,
    Pedido: d.pedido,
    Cobro: d.cobro,
    Fecha: d.hora,
    Latitud: d.lat,
    Longitud: d.lng,
    Mapa: `https://www.google.com/maps?q=${d.lat},${d.lng}`
  }));
  const ws = XLSX.utils.json_to_sheet(datosExcel);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Visitas");
  XLSX.writeFile(wb, `TrazaGO_${new Date().toLocaleDateString()}.xlsx`);
}
</script></head><body>
<div id="loginAdmin" class="login">
  <h2>TrazaGO</h2><small>Panel Jefe</small><br><br>
  <input id="adminEmail" placeholder="Correo">
  <input id="adminPass" type="password" placeholder="Contraseña">
  <button onclick="entrarAdmin()">Entrar</button>
  <p id="adminErr" style="color:red"></p>
</div>
<div id="panel" style="display:none">
<div class="top">
 <h3>TrazaGO - Panel Jefe <small id="nombreEmpresaTop" style="font-weight:normal"></small></h3>
  <div style="display:flex;gap:8px">
    <button class="btn btn-green" onclick="descargarExcel()">📊 Descargar Excel</button>
    <button class="btn btn-white" onclick="cargar()">↻ Actualizar</button>
  </div>
</div>
<div class="stats">
  <div class="stat"><b id="totalVis">0</b><small>Visitas Totales</small></div>
  <div class="stat"><b id="totalPed">$0</b><small>Pedidos Totales</small></div>
  <div class="stat"><b id="totalCob">$0</b><small>Cobros Totales</small></div>
</div>

<div class="card">
  <h4>➕ Invitar vendedor</h4>
  <input id="vendEmail" placeholder="Correo del vendedor">
  <input id="vendPass" type="password" placeholder="Contraseña para el vendedor (mín. 6 caracteres)">
  <button onclick="invitarVendedor()">Crear vendedor</button>
  <p id="vendMsg" style="font-size:13px;margin-top:4px"></p>
  <div id="listaVendedores" style="margin-top:10px"></div>
</div>

<h4 style="margin:10px 4px">🏆 Ranking por Vendedor</h4>
<div id="ranking" class="rank"></div>
<h4 style="margin:18px 4px 8px">📋 Últimas Visitas</h4>
<div id="lista"></div>
</div>
</body></html>
