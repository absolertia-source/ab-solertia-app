<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB SOLERTIA</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;padding:12px}.login{max-width:360px;margin:40px auto;background:white;padding:24px;border-radius:20px}.card{background:white;padding:14px;border-radius:16px;margin:10px 0}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}button{background:#0f172a;color:white;font-weight:bold;border:none}.top{display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:white;padding:12px;border-radius:12px}#gpsStat{font-size:12px;padding:10px;background:#fef3c7;border-radius:8px;margin:8px 0}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWWN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
window.guardarFirebase = async (d) => { return await addDoc(collection(db,"visitas"), {...d, creado: serverTimestamp()}); }
</script></head><body>
<div id="login" class="login"><h2>AB SOLERTIA</h2><small>Vendedores Cúcuta</small><br><br><input id="emp" placeholder="Empresa: CLIENTE6"><input id="vend" placeholder="Vendedor: vendedor1"><input id="pass" type="password" placeholder="Clave: 1234"><button onclick="entrar()">Entrar</button><p id="err" style="color:red"></p></div>
<div id="app" style="display:none"><div class="top"><b id="info"></b><button onclick="salir()" style="width:auto;padding:6px 12px">Salir</button></div><button onclick="nueva()" style="margin-top:12px">+ Nueva Visita</button><div id="lista"></div></div>
<div id="formVis" style="display:none;position:fixed;inset:0;background:#0008;padding:12px;overflow:auto"><div class="card" style="max-width:500px;margin:20px auto"><h3>Nueva Visita</h3><div id="gpsStat">📡 Esperando GPS...</div><input id="cli" placeholder="Nombre Cliente / Tienda"><input id="ped" type="number" placeholder="Valor Pedido $"><input id="cob" type="number" placeholder="Valor Cobro $"><p style="font-size:12px;margin-top:8px">📸 Foto (en celular abre cámara):</p><input id="fotoFile" type="file" accept="image/*" capture="environment"><img id="prevFoto" style="width:100%;display:none;border-radius:10px;margin-top:8px"><button onclick="guardar()">Guardar en la Nube</button><button onclick="document.getElementById('formVis').style.display='none'" style="background:#e2e8f0;color:#0f172a">Cancelar</button></div></div>
<script>
let fotoBase='',lat=7.8897,lng=-72.4967;
document.getElementById('fotoFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{fotoBase=r.result; document.getElementById('prevFoto').src=r.result; document.getElementById('prevFoto').style.display='block';}; r.readAsDataURL(f);});
function entrar(){const em=document.getElementById('emp').value.trim().toUpperCase(), ve=document.getElementById('vend').value.trim(), p=document.getElementById('pass').value.trim(); if(em=='CLIENTE6'&&ve=='vendedor1'&&p=='1234'){localStorage.setItem('ab_emp',em);localStorage.setItem('ab_vend',ve);mostrarApp();} else document.getElementById('err').innerText='Datos incorrectos';}
function mostrarApp(){document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('info').innerText=localStorage.getItem('ab_emp')+' | '+localStorage.getItem('ab_vend');}
function salir(){localStorage.clear();location.reload();}
function nueva(){document.getElementById('formVis').style.display='block'; document.getElementById('gpsStat').innerText='📡 Buscando GPS...'; if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{lat=pos.coords.latitude; lng=pos.coords.longitude; document.getElementById('gpsStat').innerText='✅ GPS OK: '+lat.toFixed(5)+','+lng.toFixed(5);},err=>{document.getElementById('gpsStat').innerText='⚠️ GPS bloqueado, usando Cúcuta por defecto '+lat.toFixed(4)+','+lng.toFixed(4)+' (Guarda igual)';},{enableHighAccuracy:true,timeout:8000});}}
async function guardar(){const cli=document.getElementById('cli').value; const ped=document.getElementById('ped').value||0; const cob=document.getElementById('cob').value||0; if(!cli){alert('Pon nombre cliente');return;} try{await window.guardarFirebase({empresa:localStorage.getItem('ab_emp'),vendedor:localStorage.getItem('ab_vend'),cliente:cli,pedido:ped,cobro:cob,foto:fotoBase||'',lat:lat,lng:lng,hora:new Date().toLocaleString()}); alert('¡Guardado en Firebase!'); document.getElementById('formVis').style.display='none'; document.getElementById('cli').value=''; document.getElementById('prevFoto').style.display='none';}catch(e){alert('Error: '+e.message);}}
if(localStorage.getItem('ab_emp')) mostrarApp();
</script></body></html>
