<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrazaGO | Validación de Entregas</title>
<meta name="description" content="Sistema de registro y georreferenciación de entregas de pedidos.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;padding:12px}.login{max-width:360px;margin:40px auto;background:white;padding:24px;border-radius:20px}.card{background:white;padding:14px;border-radius:16px;margin:10px 0}input,button,select{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}button{background:#0f172a;color:white;font-weight:bold;border:none}button:disabled{opacity:0.6;cursor:not-allowed}.top{display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:white;padding:12px;border-radius:12px}#gpsStat{font-size:12px;padding:10px;background:#fef3c7;border-radius:8px;margin:8px 0}#offlineAlert{display:none;background:#dc2626;color:white;padding:10px;border-radius:12px;text-align:center;font-size:13px;margin-bottom:10px;font-weight:bold}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// --- Variables globales ---
let fotoBase='', lat=7.8897, lng=-72.4967;
let gpsValido=true;
let miEmpresaId=null;
let firmaBase='', dibujando=false, firmaCtx=null;
let entregaIdActual = null;   // 👈 ID único de la entrega que se está creando

// --- Función para generar ID único de entrega (seguro y no colisiona) ---
function generarIdEntrega(){
  return 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}

// --- API expuesta a window ---
// 👇 Ahora usa setDoc con id (idempotente: subir 2 veces = 1 solo documento)
window.guardarFirebase = async (d, id) => {
  const { _id, ...dataLimpia } = d;   // quitamos metadatos locales
  return await setDoc(doc(db, "visitas", id), { ...dataLimpia, creado: serverTimestamp() });
}
window.loginFirebase = async (email, pass) => { return await signInWithEmailAndPassword(auth, email, pass); }
window.logoutFirebase = async () => { return await signOut(auth); }
window.getUsuarioDoc = async (uid) => { return await getDoc(doc(db, "usuarios", uid)); }
window.getEmpresaDoc = async (empresaId) => { return await getDoc(doc(db, "empresas", empresaId)); }
window.recuperarClave = async (email) => { return await sendPasswordResetEmail(auth, email); }
window.registrarError = async (contexto, mensaje) => {
  try{ await addDoc(collection(db,"errores"), { app:'index', contexto, mensaje, usuario: localStorage.getItem('ab_vend')||'', empresa_id: localStorage.getItem('ab_empresa')||'', fecha: serverTimestamp() }); }catch(e){}
}

// ================================================================
// FUNCIONES INTERNAS
// ================================================================

function chequearConexion(){
  const alertEl = document.getElementById('offlineAlert');
  alertEl.style.display = navigator.onLine ? 'none' : 'block';
}

function mostrarApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('info').innerText = localStorage.getItem('ab_vend') || '';
  chequearConexion();
  sincronizarPendientes();
}

async function sincronizarPendientes(){
  const pendientes = JSON.parse(localStorage.getItem('pendientes_traza') || '[]');
  if(pendientes.length === 0) return;
  if(!auth.currentUser) return;

  console.log('Sincronizando ' + pendientes.length + ' entregas...');
  const restantes = [];
  for(let i=0; i<pendientes.length; i++){
    const p = pendientes[i];
    // Si por alguna razón no tiene _id (entregas viejas antes del fix), le generamos uno
    const idFinal = p._id || generarIdEntrega();
    try{
      await window.guardarFirebase(p, idFinal);
    } catch(e){
      console.error('Error subiendo pendiente', e);
      restantes.push(p);
    }
  }
  if(restantes.length === 0){
    localStorage.removeItem('pendientes_traza');
    alert('✅ Se han sincronizado ' + pendientes.length + ' entregas pendientes.');
  } else {
    localStorage.setItem('pendientes_traza', JSON.stringify(restantes));
    alert('⚠️ Se subieron ' + (pendientes.length - restantes.length) + ' y quedan ' + restantes.length + ' pendientes.');
  }
}

// ================================================================
// FUNCIONES EXPUESTAS A WINDOW
// ================================================================

// --- Autenticación reactiva ---
onAuthStateChanged(auth, async (user) => {
  if(!user){
    localStorage.removeItem('ab_vend');
    localStorage.removeItem('ab_empresa');
    document.getElementById('login').style.display='block';
    document.getElementById('app').style.display='none';
    return;
  }
  try {
    const snap = await window.getUsuarioDoc(user.uid);
    if(!snap.exists() || !snap.data().empresa_id){
      alert('Tu cuenta no está vinculada a ninguna empresa. Contacta al administrador.');
      await window.logoutFirebase();
      return;
    }
    localStorage.setItem('ab_vend', snap.data().email || user.email);
    localStorage.setItem('ab_empresa', snap.data().empresa_id);
    miEmpresaId = snap.data().empresa_id;
    mostrarApp();
  } catch(e){
    console.error('Error verificando perfil', e);
    document.getElementById('login').style.display='block';
    document.getElementById('app').style.display='none';
  }
});

window.entrar = async () => {
  const email=document.getElementById('emp').value.trim();
  const p=document.getElementById('pass').value.trim();
  const err=document.getElementById('err');
  err.innerText='';
  try{
    await window.loginFirebase(email, p);
  } catch(e){
    if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'){
      err.innerText='Correo o contraseña incorrectos';
    } else if(e.code === 'auth/invalid-email'){
      err.innerText='Correo inválido';
    } else if(e.code === 'auth/too-many-requests'){
      err.innerText='Demasiados intentos. Espera unos minutos.';
    } else {
      err.innerText='Error: '+e.code;
    }
  }
}

window.olvide = async () => {
  const email = document.getElementById('emp').value.trim();
  if(!email){ alert('Escribe tu correo arriba primero'); return; }
  try{ await window.recuperarClave(email); alert('Correo enviado a ' + email); }
  catch(e){ alert('Error: '+e.code); }
}

window.salir = () => {
  window.logoutFirebase().then(() => {
    localStorage.removeItem('ab_vend');
    localStorage.removeItem('ab_empresa');
    location.reload();
  });
}

window.nueva = () => {
  // 🔑 Genera el ID único para esta entrega
  entregaIdActual = generarIdEntrega();
  console.log('Nueva entrega con ID: ' + entregaIdActual);

  // Limpiar el formulario por si quedó algo de la vez anterior
  document.getElementById('guia').value = '';
  document.getElementById('cli').value = '';
  document.getElementById('estado').value = 'Entregado';
  document.getElementById('prevFoto').style.display = 'none';
  document.getElementById('infoFoto').innerText = '';
  document.getElementById('fotoFile').value = '';
  fotoBase = '';
  firmaBase = '';

  document.getElementById('formVis').style.display='block';
  document.getElementById('gpsStat').innerText='📡 Buscando GPS...';
  document.getElementById('gpsStat').style.background='#fef3c7';
  initFirma();
  window.limpiarFirma();
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        lat=pos.coords.latitude;
        lng=pos.coords.longitude;
        gpsValido=true;
        document.getElementById('gpsStat').innerText='✅ GPS OK ('+lat.toFixed(4)+', '+lng.toFixed(4)+')';
        document.getElementById('gpsStat').style.background='#dcfce7';
      },
      err=>{
        gpsValido=false;
        document.getElementById('gpsStat').innerText='❌ Sin GPS - Se guardará sin ubicación precisa';
        document.getElementById('gpsStat').style.background='#fecaca';
      },
      { enableHighAccuracy:true, timeout:8000 }
    );
  }
}

window.guardar = async () => {
  const btn = document.getElementById('btnGuardar');

  // 🛡️ Guardia 1: evita doble clic
  if(btn && btn.disabled) return;

  if(!auth.currentUser){
    alert('Tu sesión expiró. Vuelve a entrar.');
    location.reload();
    return;
  }

  // 🛡️ Guardia 2: valida que exista un ID generado
  if(!entregaIdActual){
    entregaIdActual = generarIdEntrega();
    console.log('ID generado en guardar(): ' + entregaIdActual);
  }

  const guia = document.getElementById('guia').value.trim();
  const cli  = document.getElementById('cli').value.trim();
  const estado = document.getElementById('estado').value;
  if(!guia || !cli || !fotoBase || !firmaBase){
    alert('Completa todos los campos y la firma'); return;
  }

  // 🔒 Deshabilitar el botón mientras se procesa
  if(btn){
    btn.disabled = true;
    btn.innerText = 'Guardando...';
  }

  const dato = {
    empresa_id: localStorage.getItem('ab_empresa'),
    vendedor: localStorage.getItem('ab_vend'),
    guia: guia, cliente: cli, estado: estado,
    foto: fotoBase, firma: firmaBase,
    lat: lat, lng: lng, gpsValido: gpsValido,
    hora: new Date().toLocaleString()
  };

  try {
    if(!navigator.onLine){
      // Guardar pendiente con su ID para subirlo idéntico al reconectar
      const pendientes = JSON.parse(localStorage.getItem('pendientes_traza') || '[]');
      pendientes.push({ ...dato, _id: entregaIdActual });
      localStorage.setItem('pendientes_traza', JSON.stringify(pendientes));
      alert('📡 Sin internet. Entrega guardada localmente y se subirá al conectar.');
    } else {
      try{
        await window.guardarFirebase(dato, entregaIdActual);
        alert('¡Entrega Registrada!');
      } catch(e){
        // Si falla por red, guardar como pendiente para reintentar
        const pendientes = JSON.parse(localStorage.getItem('pendientes_traza') || '[]');
        pendientes.push({ ...dato, _id: entregaIdActual });
        localStorage.setItem('pendientes_traza', JSON.stringify(pendientes));
        alert('⚠️ Error al subir ('+e.message+'). Se guardó localmente y se reintentará.');
      }
    }

    // Cerrar y limpiar
    document.getElementById('formVis').style.display='none';
    document.getElementById('guia').value='';
    document.getElementById('cli').value='';
    document.getElementById('prevFoto').style.display='none';
    document.getElementById('infoFoto').innerText = '';
    document.getElementById('fotoFile').value = '';
    fotoBase='';
    window.limpiarFirma();
    entregaIdActual = null;   // se regenerará la próxima vez
  } finally {
    // 🔓 Rehabilitar el botón pase lo que pase
    if(btn){
      btn.disabled = false;
      btn.innerText = 'Guardar Entrega';
    }
  }
}

window.limpiarFirma = function(){
  const canvas = document.getElementById('firmaCanvas');
  if(firmaCtx) firmaCtx.clearRect(0,0,canvas.width,canvas.height);
  firmaBase='';
}

// ================================================================
// Inicialización de firma y compresión de foto
// ================================================================

function initFirma(){
  const canvas = document.getElementById('firmaCanvas');
  if(!canvas || firmaCtx) return;
  firmaCtx = canvas.getContext('2d');
  firmaCtx.strokeStyle = '#0f172a';
  firmaCtx.lineWidth = 2.5;
  firmaCtx.lineCap = 'round';
  function posDe(e){
    const rect = canvas.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: px * (canvas.width/rect.width), y: py * (canvas.height/rect.height) };
  }
  function empezar(e){ dibujando=true; const p=posDe(e); firmaCtx.beginPath(); firmaCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function mover(e){ if(!dibujando) return; const p=posDe(e); firmaCtx.lineTo(p.x,p.y); firmaCtx.stroke(); e.preventDefault(); }
  function terminar(){ if(!dibujando) return; dibujando=false; firmaBase = canvas.toDataURL('image/png'); }
  canvas.addEventListener('mousedown', empezar); canvas.addEventListener('mousemove', mover); canvas.addEventListener('mouseup', terminar);
  canvas.addEventListener('touchstart', empezar, {passive:false}); canvas.addEventListener('touchmove', mover, {passive:false}); canvas.addEventListener('touchend', terminar);
}

document.getElementById('fotoFile').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    const max = 800;
    if(w > h){ if(w > max){ h *= max/w; w = max; } } else { if(h > max){ w *= max/h; h = max; } }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    fotoBase = canvas.toDataURL('image/jpeg', 0.6);
    document.getElementById('prevFoto').src = fotoBase;
    document.getElementById('prevFoto').style.display = 'block';
    document.getElementById('infoFoto').innerText = '✅ Foto lista';
  };
  img.src = URL.createObjectURL(file);
});

// --- Auto-sync al recuperar conexión ---
window.addEventListener('online',  () => { chequearConexion(); sincronizarPendientes(); });
window.addEventListener('offline', chequearConexion);

</script></head><body>
<div id="offlineAlert">⚠️ Modo Offline: Los datos se guardarán localmente y se subirán al recuperar conexión.</div>
<div id="login" class="login">
  <h2>TrazaGO</h2>
  <small>Mensajeros / Entregadores</small><br><br>
  <input id="emp" placeholder="Correo" autocomplete="username">
  <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button onclick="entrar()">Entrar</button>
  <p id="err" style="color:red"></p>
  <p style="text-align:center;font-size:13px;margin-top:8px">
    <a href="#" onclick="olvide();return false;" style="color:#0f172a">¿Olvidaste tu contraseña?</a>
  </p>
</div>
<div id="app" style="display:none">
  <div class="top">
    <b id="info"></b>
    <button onclick="salir()" style="width:auto;padding:6px 12px">Salir</button>
  </div>
  <button onclick="nueva()" style="margin-top:12px">+ Registrar Entrega</button>
  <div id="lista"></div>
</div>
<div id="formVis" style="display:none;position:fixed;inset:0;background:#0008;padding:12px;overflow:auto">
  <div class="card" style="max-width:500px;margin:20px auto">
    <h3>Nueva Entrega</h3>
    <div id="gpsStat">📡 Esperando GPS...</div>
    <input id="guia" placeholder="Número de Pedido / Guía">
    <input id="cli" placeholder="Nombre del Receptor / Dirección">
    <p style="font-size:12px;margin-top:8px">📦 Estado de la Entrega:</p>
    <select id="estado">
      <option value="Entregado">✅ Entregado</option>
      <option value="Rechazado">❌ Rechazado</option>
      <option value="No Encontrado">⚠️ Dirección no encontrada</option>
    </select>
    <p style="font-size:12px;margin-top:8px">📸 Foto de Evidencia:</p>
    <input id="fotoFile" type="file" accept="image/*" capture="environment">
    <div id="infoFoto" style="font-size:11px;color:green"></div>
    <img id="prevFoto" style="width:100%;display:none;border-radius:10px;margin-top:8px">
    <p style="font-size:12px;margin-top:10px">✍️ Firma de quien recibe:</p>
    <canvas id="firmaCanvas" width="460" height="180" style="border:1px solid #e2e8f0;border-radius:10px;touch-action:none;background:#fff;display:block;width:100%;max-width:100%;margin-top:4px"></canvas>
    <button type="button" onclick="limpiarFirma()" style="background:#e2e8f0;color:#0f172a;margin-top:6px">Borrar firma</button>
    <button id="btnGuardar" onclick="guardar()">Guardar Entrega</button>
    <button onclick="document.getElementById('formVis').style.display='none'" style="background:#e2e8f0;color:#0f172a">Cancelar</button>
  </div>
</div>
</body></html>
