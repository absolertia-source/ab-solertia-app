<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Acceso Emergencia SuperAdmin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh}
.login{background:white;padding:30px;border-radius:20px;width:350px;text-align:center;box-shadow:0 10px 20px rgba(0,0,0,0.1)}
input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ddd}
button{width:100%;padding:12px;background:#0f172a;color:white;border:none;border-radius:10px;cursor:pointer;font-weight:bold}
#status{margin-top:15px; font-weight:bold; font-size:14px}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.intentarEntrar = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  const status = document.getElementById('status');
  status.innerText = "Verificando...";
  status.style.color = "blue";

  try {
    // PASO 1: LOGIN
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    status.innerText = "✅ Login Correcto. Verificando Rol...";
    
    // PASO 2: ROL
    const userDoc = await getDoc(doc(db, "usuarios", cred.user.uid));
    if (userDoc.exists()) {
      const rol = userDoc.data().rol;
      status.innerText = "✅ ACCESO TOTAL. Tu rol es: " + rol;
      status.style.color = "green";
      alert("SISTEMA OPERATIVO: Ya puedes entrar al panel");
    } else {
      status.innerText = "❌ Error: Usuario autenticado pero no existe en la tabla 'usuarios'";
      status.style.color = "red";
    }
  } catch (e) {
    status.innerText = "❌ Error de acceso: " + e.message;
    status.style.color = "red";
  }
}
</script></head><body>
<div class="login">
  <h2>Entrada de Emergencia</h2>
  <input id="email" type="email" placeholder="Correo">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="intentarEntrar()">Probar Acceso</button>
  <div id="status"></div>
</div>
</body></html>
