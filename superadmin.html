<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAGNÓSTICO SuperAdmin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;padding:12px}
.login{max-width:360px;margin:60px auto;background:white;padding:24px;border-radius:20px;box-shadow:0 4px 10px #0002}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}
.login button{width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:white;font-weight:bold;margin-top:6px;cursor:pointer}
#err{color:red; text-align:center; font-size:13px; margin-top:10px; font-weight:bold}
.panel{display:none; background:white; padding:20px; border-radius:20px; max-width:800px; margin:20px auto;}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.entrarSuper = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const err = document.getElementById('err');
  err.innerText = 'Intentando entrar...';
  
  try {
    // PASO 1: Autenticación
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    console.log("Paso 1 OK: Autenticación exitosa");
    
    // PASO 2: Buscar en la base de datos
    const userSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
    
    if(!userSnap.exists()){
      err.innerText = '❌ ERROR: El usuario está autenticado pero NO EXISTE en la tabla de "usuarios".';
      await signOut(auth); 
      return;
    }
    
    const userData = userSnap.data();
    console.log("Datos del usuario:", userData);
    
    // PASO 3: Validar el Rol
    if(userData.rol !== "superadmin"){
      err.innerText = `❌ ERROR: Rol incorrecto. Tu rol es: ${userData.rol}. Debe ser: superadmin`;
      await signOut(auth); 
      return;
    }
    
    err.innerText = '✅ ¡Acceso concedido!';
    err.style.color = 'green';
    setTimeout(() => {
        document.getElementById('login').style.display='none';
        document.getElementById('panel').style.display='block';
    }, 1000);

  } catch(e) { 
    if(e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
        err.innerText = '❌ ERROR: Correo o contraseña incorrectos.';
    } else {
        err.innerText = '❌ ERROR TÉCNICO: ' + e.message;
    }
  }
}
</script></head><body>
<div id="login" class="login"><h2 style="text-align:center">Diagnóstico SuperAdmin</h2><p style="text-align:center; color:gray">Probando acceso...</p><br><input id="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button onclick="entrarSuper()">Probar Acceso</button><p id="err"></p></div>
<div id="panel" class="panel"><h1 style="text-align:center">¡ENTRADA EXITOSA!</h1><p style="text-align:center">El sistema de acceso funciona correctamente.</p></div>
</body></html>
