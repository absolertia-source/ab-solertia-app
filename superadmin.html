<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrazaGO | Super Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;padding:12px}
.login{max-width:360px;margin:60px auto;background:white;padding:24px;border-radius:20px}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}
.login button{width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:white;font-weight:bold;margin-top:6px}
.panel{display:none; background:white; padding:20px; border-radius:20px; max-width:800px; margin:20px auto;}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.entrarSuper = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const err = document.getElementById('err');
  err.innerText = '';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const userSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
    if(!userSnap.exists() || (userSnap.data().rol !== "superadmin" && userSnap.data().rol !== "admin")){
      err.innerText = 'No tienes permisos de superadministrador';
      await signOut(auth); return;
    }
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
  } catch(e) { err.innerText = 'Error: Contraseña o correo incorrecto'; }
}
</script></head><body>
<div id="login" class="login"><h2>Super Admin</h2><br><input id="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button onclick="entrarSuper()">Entrar</button><p id="err" style="color:red"></p></div>
<div id="panel" class="panel"><h1>Bienvenido Super Admin</h1><p>Aquí tienes el control total del sistema.</p></div>
</body></html>
