<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrazaGO | Super Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;padding:12px}
.login{max-width:360px;margin:60px auto;background:white;padding:24px;border-radius:20px}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin:6px 0}
.login button{width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:white;font-weight:bold;margin-top:6px}
.top{background:#0f172a;color:white;padding:16px;border-radius:16px;margin-bottom:14px}
.empresa{background:white;padding:14px;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0001}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.badge-activa{background:#dcfce7;color:#16a34a}
.badge-bloqueada{background:#fecaca;color:#dc2626}
.btn-toggle{padding:8px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;color:white}
.btn-bloquear{background:#dc2626}
.btn-activar{background:#16a34a}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAztR8cTNbDYZlHWWHN5J1ewI5DlrTregI", authDomain: "ab-solertia.firebaseapp.com", projectId: "ab-solertia", storageBucket: "ab-solertia.firebasestorage.app", messagingSenderId: "951500964119", appId: "1:951500964119:web:208c481e237612ff4af752" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.entrarSuper = async () => {
  const email = document.getElementById('superEmail').value.trim();
  const pass = document.getElementById('superPass').value.trim();
  const err = document.getElementById('superErr');
  err.innerText = '';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const usuarioSnap = await getDoc(doc(db, "usuarios", cred.user.uid));
    if(!usuarioSnap.exists() || usuarioSnap.data().rol !== "superadmin"){
      err.innerText = 'Esta cuenta no tiene permisos de superadministrador';
      await signOut(auth);
      return;
    }
    document.getElementById('loginSuper').style.display = 'none';
    document.getElementById('panelSuper').style.display = 'block';
    cargarEmpresas();
  } catch(e) {
    err.innerText = 'Error: ' + e.code;
  }
}

async function cargarEmpresas(){
  const snap = await getDocs(collection(db, "empresas"));
  let html = '';
  snap.forEach(d => {
    const data = d.data();
    const activa = data.activa !== false;
    html += `<div class="empresa">
      <div>
        <b>${data.nombre || '(sin nombre)'}</b>
        <br><span class="badge ${activa ? 'badge-activa' : 'badge-bloqueada'}">${activa ? 'Activa' : 'Bloqueada'}</span>
      </div>
      <button class="btn-toggle ${activa ? 'btn-bloquear' : 'btn-activar'}" onclick="cambiarEstado('${d.id}', ${activa})">
        ${activa ? 'Bloquear' : 'Activar'}
      </button>
      <button class="btn-toggle" style="background:#6b7280;margin-left:6px" onclick="eliminarEmpresa('${d.id}', '${(data.nombre||'').replace(/'/g,"")}')">
        🗑️ Eliminar
      </button>
    </div>`;
  });
  document.getElementById('listaEmpresas').innerHTML = html || '<p>No hay empresas registradas todavía</p>';
}

window.cambiarEstado = async (empresaId, estadoActual) => {
  await updateDoc(doc(db, "empresas", empresaId), { activa: !estadoActual });
  cargarEmpresas();
}

window.eliminarEmpresa = async (empresaId, nombreEmpresa) => {
  const confirmar = confirm(`¿Seguro que quieres ELIMINAR "${nombreEmpresa}"?\n\nEsto borrará permanentemente:\n- La empresa\n- Todos sus vendedores registrados\n- Todas sus visitas\n\nEsta acción NO se puede deshacer. Ya descargaste el respaldo, ¿verdad?`);
  if(!confirmar) return;

  const visitasSnap = await getDocs(query(collection(db,"visitas"), where("empresa_id","==",empresaId)));
  for (const v of visitasSnap.docs) { await deleteDoc(doc(db,"visitas", v.id)); }

  const usuariosSnap = await getDocs(query(collection(db,"usuarios"), where("empresa_id","==",empresaId)));
  for (const u of usuariosSnap.docs) { await deleteDoc(doc(db,"usuarios", u.id)); }

  await deleteDoc(doc(db,"empresas", empresaId));

  alert('✅ Empresa eliminada de Firestore.\n\nRecuerda: las cuentas de acceso (correos/claves) siguen existiendo en Firebase Authentication. Si quieres borrarlas también, hazlo manualmente ahí.');
  cargarEmpresas();
}

window.descargarBackup = async () => {
  const btn = document.getElementById('btnBackup');
  btn.innerText = 'Generando respaldo...';
  btn.disabled = true;
  try {
    const backup = {};
    for (const nombreColeccion of ["empresas", "usuarios", "visitas"]) {
      const snap = await getDocs(collection(db, nombreColeccion));
      backup[nombreColeccion] = [];
      snap.forEach(d => backup[nombreColeccion].push({ id: d.id, ...d.data() }));
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `TrazaGO_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Error generando el respaldo: ' + e.message);
  }
  btn.innerText = '💾 Descargar respaldo completo';
  btn.disabled = false;
}
</script></head><body>
<div id="loginSuper" class="login">
  <h2>TrazaGO</h2><small>Super Admin</small><br><br>
  <input id="superEmail" placeholder="Correo">
  <input id="superPass" type="password" placeholder="Contraseña">
  <button onclick="entrarSuper()">Entrar</button>
  <p id="superErr" style="color:red"></p>
</div>
<div id="panelSuper" style="display:none">
  <div class="top"><h3>TrazaGO - Super Admin</h3></div>
  <button id="btnBackup" class="btn-toggle btn-activar" style="margin-bottom:14px" onclick="descargarBackup()">💾 Descargar respaldo completo</button>
  <div id="listaEmpresas"></div>
</div>
</body></html>
